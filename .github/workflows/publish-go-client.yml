#
# Publishes the Go client image to ghcr.io/<owner>/bca-alert-client-go
# whenever client/go changes on main. The Dockerfile runs the tests first,
# so a failing test stops the publication.
name: publish go client

on:
  push:
    branches: [main]
    paths:
      - client/go/**
      - .github/workflows/publish-go-client.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-go-client
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}-go

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned by commit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: client/go
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
